# SMC runtime configuration. Strategy parameters: the `smc` section (defaults in src/sp2l/smc/model.py).
database_url: postgresql+psycopg:///sp2l_dev?host=/tmp
# Markets traded together on ONE shared simulated wallet (smc.account_usdt).
symbols: [BTCUSDT, XRPUSDT]
# Tabdeal FAPI exchangeInfo (2026-10-04): pricePrecision / quantityPrecision.
instruments:
  BTCUSDT: {tick: "0.1", step: "0.00001"}
  XRPUSDT: {tick: "0.00001", step: "0.1"}

collector:
  grace_ms: 2000          # B05
  ping_interval_s: 1.0
  ping_timeout_s: 3.0
  clock_safety_ms: 1000   # coverage margin for local-vs-exchange clock offset
  heartbeat_s: 30
  # B46 transport-redundancy test: independent connections, started staggered. Coverage is
  # the union of each connection's own pong-proven coverage; DATA_GAP rules are unchanged.
  connections: [A, B]
  stagger_s: 600
  # V5.6 exact gap repair from Tabdeal's public recent-trades (last 50 trades, read-only).
  # Accepted only if exact (see marketdata/repair.py); otherwise the gap is UNRECOVERED.
  repair:
    enabled: true
    max_gap_s: 120            # longer gaps cannot be inside a 50-trade window: UNRECOVERED
    rest_delay_min_ms: -100   # Tabdeal record time - WS time: measured -25 .. +427 ms
    rest_delay_max_ms: 500    #   (3,527 trades, 2.5 h, p50 +33 ms, p99.9 +287 ms)
  # V5.7 continuous REST reconciliation (B48 mandatory). recent-trades returns the newest 50
  # trades (measured span 42.6 s min, 50 s p1, 105 s p50); polls are spaced at a third of the
  # last window so windows always overlap. A minute is final only after REST covered it, or
  # after the deadline (then LIVE_WS_ONLY).
  rest_reconciliation:
    enabled: true
    poll_min_s: 3
    poll_max_s: 15
    stale_s: 45
    reconcile_deadline_s: 60
  history_recovery:               # V5.8 tier 3: validated Tabdeal chart history (read-only)
    enabled: true
    max_gap_s: 604800               # 7 days (1-minute retention measured >= 90 days)
    deadline_s: 300                 # retries after the gap's last minute is final
    settle_s: 5
    overlap_minutes: 15
    min_overlap_minutes: 5
    min_agreement: "0.8"            # exact H/L/C/V under the continuity model
    max_hl_rel_diff: "0.001"
  history_bootstrap:              # V5.12 cold start: fill the series from Tabdeal's chart (read-only)
    enabled: false                  # default off; needs history_recovery.enabled
    max_lookback_s: 604800          # 7 days (XAUT_USDT futures exist since ~2026-06-27)
    timeout_s: 180                  # one res=1 request; a full-history pull takes ~30 s
    validate_minutes: 60            # compare with up to this many recent live minutes
    min_live_minutes: 5             # stored live minutes (any run) needed to validate against
    max_fill_gap_minutes: 2         # chart holes up to this long = synthetic no-trade minutes

# Fees and the SL slippage allowance are never hardcoded. Fill these in from your actual
# Tabdeal account tier, as fractions (0.0002 = 0.02 %). The SMC runner refuses to start while
# any value is missing; every signal's R is net of them.
costs:
  # Evidence: docs/cost_evidence.json (2026-09-27, scripts/cost_evidence.py, read-only public data).
  # Fees = Tabdeal special-margin commission level 1 (30-day volume 0 - 1,000,000; this account
  # is far below it), from api-web.tabdeal.org/get-commission-levels-v2/, the table Tabdeal's
  # own futures UI uses. Tabdeal publishes no slippage figure: the allowance is MEASURED as
  # p99(half-spread, 90 order-book samples) + p99(stop overshoot by the first trade through a
  # level, 24 h trade tape) = 0.38 bp + 1.60 bp (max overshoot seen 8.2 bp).
  maker_fee: 0.0008          # resting limit entries
  taker_fee: 0.00095         # market entries and every exit (TP charged taker conservatively)
  slippage_allowance: 0.000326   # modeled worst SL fill beyond the SL price (XAUT, 2026-09-30)
  evidence_id: "docs/cost_evidence.json@2026-09-30T08:26Z"


validation:
  server_time_max_offset_ms: 500    # B42 Live target: worst |server - local midpoint| offset
  server_time_samples: 20           # B42: at least 20 samples

# Smart Money Concepts engine, SMC-2.0 (docs/SMC_STRATEGY.md). Top-down: 4h bias -> 1h zone
# setup in strict order (liquidity sweep -> displacement BOS/CHoCH by close -> order block = last
# opposite candle, with the FVG right after it) -> limit (maker) at the OB edge touching the FVG,
# armed when price first trades into the FVG -> TP ladder (TP1 internal liquidity, TP2 opposing
# 1h zone, TP3 external liquidity + trailing stop behind 15m swings). Fills and exits are walked on
# M1. Every key below is in the parameter hash; omitted keys keep src/sp2l/smc/model.py defaults.
smc:
  # structure (every timeframe)
  swing_len: 5            # pivot = N bars on each side
  ob_rule: last_opposite  # OB = last opposite-colour candle before the displacement
  ob_min_atr: 0.5         # order blocks below half an ATR are not kept
  ob_require_fvg: true    # owner rule: the move leaving the OB must leave an FVG ...
  fvg_adjacent: true      # ... right after the OB candle (bars j, j+1, j+2)
  fvg_min_atr: 0.5        # smaller standalone gaps are not drawn as zones
  eq_tol_atr: 0.1         # swings within 0.1 ATR form one equal-highs / equal-lows pool
  sweep_max_bars: 12      # the sweep is at most 12 zone bars before the break
  # top-down model
  bias_tf: 4h
  zone_tf: 1h             # sweep, displacement, OB + FVG
  exec_tf: 15m            # confirmation (optional), trailing swings, time units
  confirm_exec: false     # true: after arming wait for a 15m BOS/CHoCH and enter at market
  # entry / stop / filters
  sl_buffer_atr: 0.2      # beyond the farther of sweep wick and OB far edge, x ATR(1h)
  max_risk_pct: 0.01      # stop at most 1 % of price
  max_cost_frac: 0        # off (owner 2026-10-05): fees count only through the net R:R to TP2
  # take-profit ladder
  tp1_frac: 0.5           # TP1 (nearest 15m swing liquidity): close 50 %, stop to break-even
  tp2_frac: 0.3           # TP2 (next opposing 1h OB/FVG): close 30 %, then trail the rest
  tp_inside_r: 1          # a level closer than 1R net counts as missing ...
  tp1_fallback_r: 1       # ... TP1 then sits at exactly 1R net
  tp2_fallback_r: 2       # ... TP2 at exactly 2R net (recorded as a fallback)
  min_net_rr_tp2: 2       # skip unless TP2 pays >= 2R after fees and slippage
  trail_buffer_atr: 0.1   # trailing stop behind the last confirmed 15m swing, x ATR(15m)
  day_boundary: utc       # previous day / ISO week high-low for TP3
  # time
  pending_expiry_min: 120 # unfilled limit cancelled 8 x 15m after arming
  time_stop_min: 180      # market exit if neither TP1 nor SL within 12 x 15m of the fill
  max_hold_min: 1440
  # data
  lookback_15m: 1400      # covers the previous ISO week
  history_days: 35        # Tabdeal chart history kept for warmup (4h needs ~30 days)
  # chart (display only)
  chart_near_atr: 3       # setups within 3 x ATR(1h) of price (or tied to a position)
  chart_top_n: 3
  # shared wallet and capacity (unchanged)
  account_usdt: 100       # the shared simulated wallet for all symbols
  risk_pct: 0.01          # risk per position, of the wallet balance at entry
  max_active: 1           # active positions per symbol
  max_positions: 2        # active positions across all symbols
# SMC-1.0 evidence (270 days, M1-trigger model) is kept in docs/SMC_STRATEGY.md.
