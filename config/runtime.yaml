# SMC runtime configuration. Strategy parameters: the `smc` section (defaults in src/sp2l/smc/model.py).
database_url: postgresql+psycopg:///sp2l_dev?host=/tmp
# Markets traded together on ONE shared simulated wallet (smc.account_usdt).
symbols: [BTCUSDT, XRPUSDT]
# Tabdeal FAPI exchangeInfo (2026-10-04): pricePrecision / quantityPrecision.
instruments:
  BTCUSDT: {tick: "0.1", step: "0.00001"}
  XRPUSDT: {tick: "0.00001", step: "0.1"}

collector:
  grace_ms: 2000          # B05
  ping_interval_s: 1.0
  ping_timeout_s: 3.0
  clock_safety_ms: 1000   # coverage margin for local-vs-exchange clock offset
  heartbeat_s: 30
  # B46 transport-redundancy test: independent connections, started staggered. Coverage is
  # the union of each connection's own pong-proven coverage; DATA_GAP rules are unchanged.
  connections: [A, B]
  stagger_s: 600
  # V5.6 exact gap repair from Tabdeal's public recent-trades (last 50 trades, read-only).
  # Accepted only if exact (see marketdata/repair.py); otherwise the gap is UNRECOVERED.
  repair:
    enabled: true
    max_gap_s: 120            # longer gaps cannot be inside a 50-trade window: UNRECOVERED
    rest_delay_min_ms: -100   # Tabdeal record time - WS time: measured -25 .. +427 ms
    rest_delay_max_ms: 500    #   (3,527 trades, 2.5 h, p50 +33 ms, p99.9 +287 ms)
  # V5.7 continuous REST reconciliation (B48 mandatory). recent-trades returns the newest 50
  # trades (measured span 42.6 s min, 50 s p1, 105 s p50); polls are spaced at a third of the
  # last window so windows always overlap. A minute is final only after REST covered it, or
  # after the deadline (then LIVE_WS_ONLY).
  rest_reconciliation:
    enabled: true
    poll_min_s: 3
    poll_max_s: 15
    stale_s: 45
    reconcile_deadline_s: 60
  history_recovery:               # V5.8 tier 3: validated Tabdeal chart history (read-only)
    enabled: true
    max_gap_s: 604800               # 7 days (1-minute retention measured >= 90 days)
    deadline_s: 300                 # retries after the gap's last minute is final
    settle_s: 5
    overlap_minutes: 15
    min_overlap_minutes: 5
    min_agreement: "0.8"            # exact H/L/C/V under the continuity model
    max_hl_rel_diff: "0.001"
  history_bootstrap:              # V5.12 cold start: fill the series from Tabdeal's chart (read-only)
    enabled: false                  # default off; needs history_recovery.enabled
    max_lookback_s: 604800          # 7 days (XAUT_USDT futures exist since ~2026-06-27)
    timeout_s: 180                  # one res=1 request; a full-history pull takes ~30 s
    validate_minutes: 60            # compare with up to this many recent live minutes
    min_live_minutes: 5             # stored live minutes (any run) needed to validate against
    max_fill_gap_minutes: 2         # chart holes up to this long = synthetic no-trade minutes

# Fees and the SL slippage allowance are never hardcoded. Fill these in from your actual
# Tabdeal account tier, as fractions (0.0002 = 0.02 %). The SMC runner refuses to start while
# any value is missing; every signal's R is net of them.
costs:
  # Evidence: docs/cost_evidence.json (2026-09-27, scripts/cost_evidence.py, read-only public data).
  # Fees = Tabdeal special-margin commission level 1 (30-day volume 0 - 1,000,000; this account
  # is far below it), from api-web.tabdeal.org/get-commission-levels-v2/, the table Tabdeal's
  # own futures UI uses. Tabdeal publishes no slippage figure: the allowance is MEASURED as
  # p99(half-spread, 90 order-book samples) + p99(stop overshoot by the first trade through a
  # level, 24 h trade tape) = 0.38 bp + 1.60 bp (max overshoot seen 8.2 bp).
  maker_fee: 0.0008          # resting limit entries
  taker_fee: 0.00095         # market entries and every exit (TP charged taker conservatively)
  slippage_allowance: 0.000326   # modeled worst SL fill beyond the SL price (XAUT, 2026-09-30)
  evidence_id: "docs/cost_evidence.json@2026-09-30T08:26Z"
  # futures funding: Tabdeal publishes no funding rate or interval (public market data and academy
  # checked read-only 2026-10-06), so it is modelled as 0; set both when known.
  funding_rate: 0            # fraction of the notional per funding time; longs pay a positive rate
  funding_interval_h: 8      # funding times every 8 h from 00:00 UTC (0 = none)


validation:
  server_time_max_offset_ms: 500    # B42 Live target: worst |server - local midpoint| offset
  server_time_samples: 20           # B42: at least 20 samples

# Smart Money Concepts engine, SMC-2.1 (docs/SMC_STRATEGY.md). Top-down: 4h bias -> 1h setup in strict
# order (liquidity sweep -> displacement BOS/CHoCH by close -> order block = last opposite candle,
# with the FVG right after it) -> limit (maker) at the OB edge touching the FVG, armed when price
# first trades into the FVG -> SL one tick beyond the OB wick, one TP at the previous HH / LL.
# Fills and exits are walked on M1. Every key below is in the parameter hash; omitted keys keep
# src/sp2l/smc/model.py defaults.
smc:
  # structure (every timeframe)
  swing_len: 5            # pivot = N bars on each side
  ob_rule: last_opposite  # OB = last opposite-colour candle before the displacement
  ob_min_atr: 0.5         # order blocks below half an ATR are not kept
  ob_require_fvg: true    # owner rule: the move leaving the OB must leave an FVG ...
  fvg_adjacent: true      # ... right after the OB candle (bars j, j+1, j+2)
  fvg_min_atr: 0.5        # smaller standalone gaps are not drawn as zones
  eq_tol_atr: 0.1         # swings within 0.1 ATR form one equal-highs / equal-lows pool
  require_sweep: true     # a liquidity sweep is required before the break (restored 2026-10-05)
  sweep_max_bars: 12      # (with require_sweep) the sweep is at most 12 zone bars before the break
  # top-down model (SMC-2.3, owner 2026-10-06: the standard SMC / ICT model for crypto futures)
  htf_grid: utc           # 1h / 4h bars at 00:00, 04:00, ... UTC (TradingView, large venues); tehran = Tabdeal's hh:30 grid
  bias_tf: 4h
  zone_tf: 15m            # sweep, displacement, OB + FVG
  exec_tf: 5m             # confirmation and the refined entry
  confirm_exec: true      # after price first trades into the 15m FVG, wait for a 5m BOS/CHoCH with the setup ...
  confirm_window_min: 240 # ... closing within 4 h ...
  confirm_in_zone: true   # ... reacting from a 5m swing inside the 15m OB + FVG zone; a 5m close beyond the OB's far edge first: ZONE_INVALID
  confirm_entry: limit    # then a limit (maker) ...
  entry_ref: ltf_fvg_ce   # ... at 50 % of the 5m FVG of the confirming move, else the edge of its 5m OB (htf_fvg_ce = SMC-2.2)
  # stop: beyond the farther of the OB wick and the sweep wick + 0.2 ATR(15m) (ob_height = SMC-2.2)
  sl_mode: structure
  sl_buffer_atr: 0.2
  # target: the nearest unswept liquidity beyond the entry (displacement high / low, unswept 15m and 1h
  # swings and equal highs / lows, the previous UTC day's high / low), 0.05 ATR(15m) before it (fixed = SMC-2.2)
  tp_mode: liquidity
  tp_rr: 3                # (tp_mode fixed only)
  tp_ref: leg
  tp_front_run_atr: 0.05
  # filters: they may reject a trade, they never move the stop or the target
  require_discount: true  # the OB's proximal edge in the discount (long) / premium (short) half ...
  discount_ref: displacement # ... of sweep wick -> displacement high / low
  min_net_rr: 2           # net R at the TP after maker entry, taker exit incl. slippage
  max_cost_frac: 0.2      # round-trip costs above 20 % of the stop distance: COST_HEAVY
  exit_on_choch: false    # true: close at market at a zone-TF CHoCH against the open trade
  # time
  pending_expiry_min: 120 # an unfilled limit is cancelled 2 h after it is placed
  time_stop_min: 0        # off (SMC-2.1); open signals keep the rule they were created with
  max_hold_min: 1440
  # data
  history_days: 35        # Tabdeal chart history kept for warmup (4h needs ~30 days)
  # chart (display only)
  chart_near_atr: 3       # setups within 3 x ATR(zone TF) of price (or tied to a position)
  chart_top_n: 3
  # shared wallet and capacity (unchanged)
  account_usdt: 100       # the shared simulated wallet for all symbols
  risk_pct: 0.01          # risk per position, of the wallet balance at entry
  max_active: 1           # active positions per symbol
  max_positions: 2        # active positions across all symbols
  liq_buffer_r: 1         # cross-margin liquidation at least 1 x the stop beyond the stop, else a smaller size (LIQ_LIMITED)
  maint_margin_rate: 0.005 # assumed: Tabdeal publishes no maintenance margin rate
# SMC-1.0 evidence (270 days, M1-trigger model) is kept in docs/SMC_STRATEGY.md.

# System B: daily Donchian trend following, long only, spot (docs/TREND_STRATEGY.md).
# Backtest: `python -m sp2l trend-backtest --csv data/binance_BTCUSDT_1d.csv`. Every key below is
# in the parameter hash; omitted keys keep src/sp2l/trend/model.py defaults. Fills are market
# orders: costs.taker_fee and costs.slippage_allowance apply to every fill (override: --fee,
# --slippage; Tabdeal spot fees differ from the futures fees above).
trend:
  entry_len: 20     # enter: daily close above the highest high of the previous 20 days
  exit_len: 10      # exit: daily close below the lowest low of the previous 10 days (next open)
  atr_len: 20
  stop_atr: 2       # initial stop 2 x ATR(20) below the fill
  regime_ma: 0      # 200: only enter while the close is above SMA(200); 0 = off
  sizing: risk      # risk: lose risk_pct of equity at the stop / full: all cash in
  risk_pct: 0.01
  max_exposure: 1   # notional / equity (1 = spot, no leverage)
  max_units: 1      # pyramiding off
  add_atr: 1
  initial_equity: 10000
  allow_short: false  # futures: the mirrored short side (report 2: it loses on BTC)
  maint_margin: 0.005 # futures: cross-margin maintenance rate for the liquidation check
