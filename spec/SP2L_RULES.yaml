spec:
  name: SP2L_V5
  version: "6.0"
  resolutions: "V5.1 = V5.0 + B01-B26; V5.2 = V5.1 + B27-B32; V5.3 = V5.2 + B27/B33/B34 revisions; V5.4 = V5.3 + B37/B38 (B10 reworded); V5.5 = V5.4 + B39-B45 (2026-09-26); V5.6 = V5.5 + market-data integrity (2026-09-27, data contract only, no strategy rule changed); V5.7 = V5.6 + continuous REST reconciliation and history-based warmup (2026-09-27, data contract only); V5.8 = V5.7 + three-tier recovery with validated Tabdeal chart history, execution certainty separated from indicator continuity, exact 10x strategy leverage and the Live LEVERAGE_MISMATCH blocker (2026-09-28); V5.9 = V5.8 + Core P-Gap qualification (strong directional impulse C2, strong gap) and the display-only live forming M1 (2026-09-28); V5.10 = V5.9 + Liquidity decided by volume when the trade count is unknown and volume is not low (2026-09-29); V5.11 = V5.10 + net-at-TP rule: no E1 unless E1 alone exited at TP is profitable after costs (2026-09-29); V5.12 = V5.11 + the V5.9 P-Gap quality filter removed as a rule: every strict geometric P-Gap qualifies, quality is only measured (2026-09-30); V6.0 = V5.12 + website-based Context: NetTP AND any of LevelBreak / ChannelEdge / HTFAligned, Exhaustion advisory, 30-bar M5 warmup, no-guess rule removed (2026-10-01); see DECISIONS.md"
  authoritative: true
  supersedes: [V1, V2, V3, V4]
  runtime_learning: false
  automatic_rule_mutation: false

market:
  entry_timeframe: 1m
  context_timeframe: 5m
  exchange: TABDEAL_FAPI
  initial_symbol: BTCUSDT
  leverage: 10
  margin_mode: CROSS
  leverage_policy:                # V5.8
    strategy_leverage: EXACTLY_10X   # Shadow, risk, margin, reports, liquidation model, UI, counterfactuals
    exchange_leverage_source: READ_ONLY_ACCOUNT_QUERY
    exchange_leverage_affects_strategy: false
    live_requires_exchange_leverage_equal_strategy: true   # else Live blocker LEVERAGE_MISMATCH
    automatic_leverage_change: false

market_data:                      # B05, B25, B31
  timestamp_source: EXCHANGE_TRADE_TIMESTAMP
  bucket_alignment: UTC_EPOCH
  zero_trade_m1:                  # B31 (supersedes B05 "missing")
    when_ws_coverage_known_healthy_for_full_minute: SYNTHETIC_NO_TRADE
    synthetic_ohlc: "O=H=L=C=previous close"
    synthetic_volume: 0
    synthetic_trade_count: 0
    flags: {synthetic_no_trade: true, data_gap: false}
    synthetic_maintains_indicator_and_time_continuity: true
    synthetic_ineligible_for: [pgap, spike_confirmation, spike_origin, directional_sequence_continuation]
    when_coverage_incomplete_or_disconnected: DATA_GAP
  post_gap_anchor:                # B34
    pre_gap_close_carried_across_gap: false
    anchor: FIRST_GENUINE_POST_GAP_TRADE_THEN_LAST_VALID_POST_GAP_PRICE
    zero_trade_minute_without_anchor: UNANCHORED   # treated as DATA_GAP; no synthetic candle
  m1_finalization_grace_ms: 2000
  late_trades: LOG_ONLY_NEVER_MUTATE_FINALIZED
  trade_count: RAW_TRADE_COUNT
  m5_source: CANONICAL_M1
  m5_inherits_m1_data_quality_flags: true
  m5_quality_fields: [synthetic_m1_count, synthetic_fraction, real_trade_count]   # B33
  m5_partially_synthetic_with_real_trade: {indicators: true, range: true, liquidity: true, pivots: true}
  m5_all_synthetic_healthy: {indicators: true, range: true, liquidity: true, pivots: false, swing_creation: false}
  unrecoverable_gap:              # DATA_GAP
    mark_incomplete: true
    synthesize_candles: false
    stop_candidate_creation: true
    break_origin_continuity: true
    reanchor_recursive_indicators: true
  gap_repair:                     # V5.6 market-data integrity (data contract, not strategy)
    transport_interruption_with_complete_merged_coverage: NO_GAP
    coverage_gap_state: GAP_PENDING_REPAIR        # minutes overlapping it are held, not finalized
    repair_source: TABDEAL_PUBLIC_RECENT_TRADES   # trade-level; OHLC-only sources never canonical
    repair_acceptance: EXACT_ONLY                 # complete window, time model holds, no ambiguous minute/open/close
    repaired_trades_path: SAME_M1_M5_PIPELINE_AS_LIVE
    repaired_candle_quality: REPAIRED_TABDEAL
    repaired_restores: [m1, m5, indicators, pivots, trend, regime, range, context_continuity]
    repaired_minutes_never: [pgap_promotion, setup_creation, order_fill, exit, pnl]
    setup_or_counterfactual_alive_across_repaired_history: AMBIGUOUS_DATA_GAP
    only_unrecovered_gap_triggers: unrecoverable_gap
    warmup_length_unchanged: true
  continuous_reconciliation:       # V5.7 (B48 mandatory; data contract, not strategy)
    sources: [WS_A, WS_B, TABDEAL_PUBLIC_RECENT_TRADES]
    rest_trade_identity: SAME_PRICE_AMOUNT_AND_RECORD_MINUS_STREAM_TIME_IN_[-100ms,+500ms]_NEAREST
    rest_only_trade: CANONICAL                   # WS omission; bucketed at record time - 33 ms
    m1_lifecycle: [OPEN, PROVISIONAL, RECONCILING, FINAL_CANONICAL]
    final_requires: REST_COVERAGE_OF_WHOLE_MINUTE_OR_RECONCILE_DEADLINE   # then LIVE_WS_ONLY
    synthetic_zero_trade_requires: REST_COVERAGE
    coverage_gap_filled_by_rest_coverage: REST_REPAIRED   # no reset
    late_rest_trade_for_final_minute: AUDITED_REVISION   # past decisions immutable
  warmup_semantics:               # V5.7
    context_warmup_counts: TRUSTED_CANONICAL_M5_HISTORY_IN_DB
    process_or_api_or_collector_restart: NO_RESET   # series resumes at the last canonical minute
    only_reset_by: [UNRECOVERED_GAP, INVALID_HISTORY]
    independent_of: [process_id, run_id, restart_count, socket_generation, ws_session, boot_time]  # V5.8
    bootstrap: [READ_CANONICAL_HISTORY, FIND_LAST_TRUSTED_MINUTE, REPAIR_INTERVAL_RECENT_TRADES_THEN_HISTORY, REBUILD_M1_M5_INDICATORS, GO_LIVE]
    ready_immediately_if_trusted_m5_at_least: 30   # V6.0 (was 150)
  live_forming_candle:            # V5.9 UI / observability only
    source: CANONICAL_LIVE_TRADES_AS_RECEIVED
    ohlcv: "O first trade, H max, L min, C latest, V sum, N count (current minute)"
    authority: NONE                 # never P-Gap, Spike, Context, Exhaustion, E1, Risk, Shadow or Live
    replaced_by: FINAL_CANONICAL_M1 # identity = symbol + M1 open_time; revisions replace it too
    transport: POSTGRES_NOTIFY_TO_SERVER_SENT_EVENTS
  history_recovery:               # V5.8 three-tier recovery (data contract, not strategy)
    tiers: [DUAL_WS, RECENT_TRADES_EXACT_REPAIR, TABDEAL_CHART_HISTORY]
    unrecovered_only_if_all_tiers_fail: true
    history_source: "GET api-web.tabdeal.org/special-margin/plots/history/ resolution=1 (public, read-only)"
    other_exchanges: FORBIDDEN
    history_bar_model: TRADINGVIEW_CONTINUOUS   # open = previous close; high/low include it; record-time buckets
    history_acceptance: [BAR_FINAL, ALL_GAP_MINUTES_PRESENT, OVERLAP_MIN_5_MINUTES, OVERLAP_EXACT_AGREEMENT_AT_LEAST_0.8, OVERLAP_HL_REL_DIFF_AT_MOST_0.001]
    history_max_gap: 7_DAYS
    repair_types:
      EXACT_RAW_REPAIR:            # recent-trades: every trade and its order recovered
        lineage: RECENT_TRADES_REPAIRED
        restores: [m1, m5, indicators, pivots, trend, regime, range, context_continuity, causal_replay]
      CANDLE_HISTORY_REPAIR:       # chart history: OHLCV only
        lineage: TABDEAL_HISTORY_REPAIRED
        restores: [m1_ohlcv, m5, atr, adx, ema, chop, pivots, trend, regime, range, context_continuity]
        never_derived: [trade_count, e1_e2_fills, pullback_start_timing, sl_tp_order, partial_fills, intrabar_chronology]
        exposed_setup: AMBIGUOUS_DATA_GAP
    retroactive_setups: false
    context_readiness:
      PRICE_CONTEXT_READY: "30 trusted M5 price bars (history bars count; V6.0, was 150)"
      LIQUIDITY_CONTEXT_READY: "context bar and the 20 bars before it have a known trade count"
      unknown_trade_count: PASS_IF_VOLUME_NOT_LOW_ELSE_LIQUIDITY_UNKNOWN   # V5.10; never invented
    lineage_values: [LIVE_RECONCILED, RECENT_TRADES_REPAIRED, TABDEAL_HISTORY_REPAIRED, SYNTHETIC_NO_TRADE, UNRECOVERED, UNANCHORED, REVISED]
  candle_reconciliation:          # V5.6
    canonical_change: REVISION_ONLY_PREVIOUS_VERSION_KEPT
    delete: FORBIDDEN
    m5: ALWAYS_REBUILT_FROM_CANONICAL_M1
    qualities: [LIVE_RECONCILED, RECENT_TRADES_REPAIRED, TABDEAL_HISTORY_REPAIRED, LIVE_WS_ONLY, SYNTHETIC_NO_TRADE, REST_REPAIRED, LIVE_PROVEN_RAW, REPAIRED_TABDEAL, CONFLICTED]
  trade_identity:                 # V5.6 audit: sequence is NOT a trade id (multi-fills)
    dedup_key: [sequence, exchange_timestamp, price, amount, occurrence]
    conflicting_payloads: LOG_WITH_RAW_NEVER_DROP

pgap:
  finalized_only: true
  bullish: "low[i+1] > high[i-1]"
  bearish: "high[i+1] < low[i-1]"
  equality_allowed: false
  qualification:                  # V5.9 measures; V5.12: NOT enforced (recorded only). C1 = i-1, C2 = i (impulse), C3 = i+1
    enforced: false
    impulse_range: "High(C2) - Low(C2)"          # <= 0 -> impulse fails
    impulse_body: "abs(Close(C2) - Open(C2))"
    body_ratio: "body / range"
    long_impulse: "Close(C2) > Open(C2) AND body_ratio >= 0.60"
    short_impulse: "Close(C2) < Open(C2) AND body_ratio >= 0.60"
    long_gap_size: "Low(C3) - High(C1)"
    short_gap_size: "Low(C1) - High(C3)"
    strong_gap: "gap_size >= 0.15 * body(C2) AND gap_size >= 2 * tick_size"
    body_ratio_min: "0.60"
    gap_body_ratio_min: "0.15"
    gap_ticks_min: 2
    equality_passes: true
    thresholds_frozen: true         # no tuning, no ML, analytics never adjust them
    colour_requirement_scope: IMPULSE_C2_ONLY   # runs and other Spike candles ignore colour
    failed_pgap_is_qualifying: true             # V5.12: every strict geometric P-Gap qualifies
    reason_codes: [PGAP_IMPULSE_WRONG_DIRECTION, PGAP_IMPULSE_BODY_TOO_WEAK, PGAP_GAP_TOO_SMALL_RELATIVE_TO_BODY, PGAP_GAP_TOO_SMALL_IN_TICKS]

directional_structure:
  long: "low[current] >= low[previous]"
  short: "high[current] <= high[previous]"
  candle_color_gate: false

spike_origin:
  long: "backtrack while low[current] >= low[previous]"
  short: "backtrack while high[current] <= high[previous]"
  freeze_after_confirmation: true

spike:                            # B02, B03, B04
  pgap_triple_must_satisfy_directional_sequence: true
  min_r_filter: false
  structural_extension: "every finalized M1 that continues the directional sequence before PullbackStart becomes LastSpikeCandle"
  one_candidate_per_directional_run: true   # the first P-Gap of the run (V5.12: all qualify)
  new_candidate_requires_sequence_break: true
  pgap_while_capacity_busy: LOG_ONLY_RUN_SPENT
  run:                            # B29
    long: "starts after the previous Low-decrease violation; continues while Low[n] >= Low[n-1]; ends at the first finalized M1 with Low[n] < Low[n-1]"
    short: "starts after the previous High-increase violation; continues while High[n] <= High[n-1]; ends at the first finalized M1 with High[n] > High[n-1]"
    violating_candle_seeds_next_run: true
    qualifying_pgap_fully_inside_run: true
  unarmed_expiry:                 # B30
    status: EXPIRED_UNARMED
    reason: E1_NEVER_ARMED
    expired_no_fill_reserved_for_active_zero_fill_e1: true

e1:
  type: LIMIT
  long: "low(last_spike_candle)"
  short: "high(last_spike_candle)"
  pre_pullback: true
  no_retroactive_fill: true
  context_recheck_before_every_submit_or_replace: true
  reprice_allowed_only_if:
    order_status: NEW
    executed_qty: 0
    setup_position_qty: 0
  any_fill_freezes_entry_price: true
  submit_guard:                   # B15
    long: "last_trade > E1"
    short: "last_trade < E1"
    equality_sufficient: false
    if_not_safe: NO_ORDER_WAIT_NEXT_M1_CLOSE_FULL_REEVALUATION
    marketable_or_taker_entry: false
  partial_fill:
    reprice_allowed: false
    keep_remaining_at_original_e1_price: true
    protect_filled_qty_immediately: true
    e2_enabled_only_after_full_e1: true
  full_fill:
    reprice_allowed: false
    entry_price_frozen: true
  cancel_replace_race:
    reconcile_order_before_replace: true
    reconcile_setup_position_before_replace: true
    if_executed_qty_gt_zero: ENTER_FILL_PROTECTION_FLOW
    if_setup_position_qty_nonzero: ENTER_FILL_PROTECTION_FLOW
    replacement_requires_old_order_inactive_and_zero_fill_and_zero_setup_position: true

pullback:
  long: "live_price <= active_E1"
  short: "live_price >= active_E1"
  freezes_repricing: true
  fill_window_candles: 4
  gate_recheck_after_pullback_while_zero_fill: true   # B14
  gate_failure_after_pullback_zero_fill: CANCEL_UNFILLED_E1

stop_loss:
  long: "origin_low - tick_size"
  short: "origin_high + tick_size"

take_profit:
  count: 1
  rr: "1:1"
  long: "E1 + abs(E1-SL)"
  short: "E1 - abs(E1-SL)"
  tp2: false
  partial_tp: false

e2:
  type: LIMIT
  price: "(E1 + SL)/2"
  rounding: TOWARD_SL             # B23
  risk_from_rounded_e2: true
  quantity: same_as_E1
  activation: after_E1_full_fill_and_protection_verified
  sl: original_SL
  tp: original_single_TP
  intent: INCREASE_SAME_DIRECTION_POSITION
  must_be_non_reducing: true
  reduce_only_false_only_if_tabdeal_semantics_runtime_validated: true

context:
  pivots:
    left: 2
    right: 2
    strict_ties: true
    all_synthetic_healthy_bar: {pivot_centre: false, pivot_neighbour: true}      # B33, B37
    data_gap_or_unanchored_bar: {pivot_centre: false, pivot_neighbour: false, window_containing_it: UNKNOWN_NOT_CONFIRMED}   # B37
    dual_pivot_fail_closed_scope: ONLY_IF_IN_SH1_SH2_SL1_SL2   # B11
  trend:
    bull: "SH2>SH1 AND SL2>SL1"
    bear: "SH2<SH1 AND SL2<SL1"
    else: NEUTRAL
  regime:
    range: "CHOP14 >= 61.8 AND ADX14 < 20"
    trend: "CHOP14 <= 38.2 OR ADX14 >= 25"
    else: TRANSITION
  range_bounds_bars: 14
  range_middle:
    min_inclusive: "1/3"          # B08 exact rational
    max_inclusive: "2/3"
    reject_only_when_regime_range: true   # V6.0: informational measure only
    price_reference: E1_RAW       # B07; clamping is display-only
  range_edge_origin:               # V6.0: B ChannelEdge (no regime requirement)
    long_max_inclusive: "1/3"
    short_min_inclusive: "2/3"
    price_reference: ORIGIN_RAW
    regime_required: NONE
    flat_range: FALSE_NOT_INVALID
  breakout_level:                 # B09, B10, B32
    selection: HIGHEST_CROSSED_PRE_SPIKE_SWING_HIGH_LONG__LOWEST_CROSSED_PRE_SPIKE_SWING_LOW_SHORT   # B27
    candidates: "confirmed, setup-eligible M5 swing levels that existed before the Spike"
    eligible_levels:              # B27 clarification (resolves B35/B36)
      long_uses: SWING_HIGH
      short_uses: SWING_LOW
      pivot_confirmed_no_later_than: SPIKE_ORIGIN_CANDLE_OPEN_TIME
      unbroken_at: SPIKE_ORIGIN_CANDLE_OPEN_TIME
      frozen_set_at_setup_creation: true
      pivots_confirmed_after_spike_origin: NEVER_ELIGIBLE
    may_become_true_after_spike_confirmation: true
    update_while: [NO_PULLBACK_START, E1_ZERO_EXECUTED, SAME_SPIKE_SEQUENCE_EXTENDING]
    may_advance_to_farther_crossed_level: true
    permanent_freeze_at: FIRST_OF_PULLBACK_START_OR_FIRST_E1_FILL
    crossed: "at least one finalized M1 candle of the current Spike closed strictly beyond the level"
    distance_based_selection: false   # never by distance from Origin, E1 or last trade
    dual_pivot_eligible: true     # High for Long, Low for Short (B32)
    frozen_per_setup: true        # permanent after PullbackStart / first E1 fill
    setup_local_obstacle_removal: false   # B10 as reworded by B38: path-relative geometry only
  # V6.0 (owner decision 2026-10-01): the website's three "best conditions" + net profit.
  gate:
    pass_iff: "net_tp AND (level_break OR channel_edge OR htf_aligned)"
    net_tp: "abs(TP - E1) - E1*entry_fee_rate - TP*exit_fee_rate > 0"   # zero rejects
    net_tp_evaluated: FIRST_EVEN_DURING_WARMUP
    net_tp_costs_missing: CONTEXT_NET_TP_UNKNOWN                       # fail closed
    level_break: BREAKOUT_CONTEXT          # strict Spike M1 close beyond an eligible level (below)
    channel_edge: RANGE_EDGE_ORIGIN_ANY_REGIME
    htf_aligned: M5_TREND_ALIGNED_ANY_REGIME
    reason_order: [CONTEXT_NET_TP_NOT_POSITIVE, CONTEXT_NET_TP_UNKNOWN, CONTEXT_UNKNOWN_WARMUP, NO_VALID_CONTEXT]
    no_other_gates: true
  informational_only: [regime, range_middle, htf_opposite_without_breakout, room_to_tp, liquidity]
  require_any:
    - breakout_context
    - htf_alignment
    - range_edge_origin
  htf_opposite_without_breakout: INFO      # V6.0 (was REJECT)
  room_to_tp_min_R: 1.0                    # V6.0: informational measure only
  room_to_tp_reference: CURRENT_OR_PROSPECTIVE_E1   # B27
  room_to_tp_obstacle_path:       # B38 (B10 reworded)
    long: "E1 < level <= TP"
    short: "TP <= level < E1"
    level_validity: CONFIRMED_AND_NOT_INVALIDATED_BY_M5_CLOSE
    crossed_by_spike_earlier_but_back_in_path: OBSTACLE
    beyond_current_e1_in_trade_direction: NOT_OBSTACLE
  obstacles_include_dual_pivots: true                # B32
  liquidity:                      # V6.0: informational measure only (never rejects)
    lookback_m5: 20
    volume_ratio_reject_below: 0.5
    tradecount_ratio_reject_below: 0.5
    conjunction: AND
    unknown_trade_count: PASS_IF_VOLUME_NOT_LOW_ELSE_LIQUIDITY_UNKNOWN   # V5.10: false AND unknown = false
  recheck_on_each_e1_revision: true

indicators:                       # B06, B06+
  adx_reference: TA_LIB
  adx_seed: TALIB_N_MINUS_1
  runtime_implementation_switch: false
  anchor: FIXED_PER_SYMBOL
  reanchor_on_data_gap: true
  context_warmup_m5_bars: 30     # V6.0 (owner decision; was 150)
  zero_denominator: UNKNOWN_FAIL_CLOSED

exhaustion:
  gating: false                   # V6.0: advisory only (recorded; ADVISORY_WOULD_REJECT / ADVISORY_UNKNOWN)
  late_trend:
    trend_age_bars_gte: 20
    microchannel_len_gte: 8
    operator: OR
  extreme_stretch_atr_gte: 2.0
  climactic_spike_atr_gte: 1.5
  outer_edge:
    long_range_position_gte: 0.90
    short_range_position_lte: 0.10
    opposing_swing_distance_atr_lte: 0.5
    operator: OR
  opposing_swing_candidates:      # B38
    long: "confirmed, M5-valid swing levels strictly above the current SpikeExtreme"
    short: "confirmed, M5-valid swing levels strictly below the current SpikeExtreme"
    crossed_levels_behind_spike_extreme: NOT_CANDIDATES
  reject_expression: "LateTrend AND ExtremeStretch AND (ClimacticSpike OR AtOuterEdge) AND NOT FreshBreakoutException"
  fresh_breakout:
    requires_confirmed_m5_swing_break: true
    previous_regime_in: [RANGE, TRANSITION]
    breakout_started_within_closed_m5_bars: 2
    m1_to_m5_mapping: M1_OPEN_TIME          # B13
    forming_m5_bucket_age: 0
  range_position_20_includes_context_bar: true   # B12

risk:
  max_complete_setup_loss_fraction: 0.01
  include_configured_costs: true
  e1_e2_equal_qty: true
  recalc_qty_on_every_e1_revision: true
  wallet_balance:                 # B16
    live: WALLET_BALANCE_EXCLUDING_UNREALIZED_PNL
    shadow: INITIAL_PLUS_REALIZED_PNL_MINUS_FEES
  costs_source: RUNTIME_CONFIG_WITH_VALIDATION_EVIDENCE
  net_at_tp:                      # V5.11
    rule: "abs(TP - E1) - E1*entry_fee_rate - TP*exit_fee_rate > 0"
    legs: E1_ONLY                 # E2 is never assumed to fill
    equality: REJECT              # zero net is rejected
    reject_reason: RISK_NET_TP_NOT_POSITIVE
    evaluated: EVERY_RISK_EVALUATION   # before the first E1 submit and on every E1 revision
  hardcoded_fees: false
  quantity:                       # B17
    formula: "Q_final = min(Q_risk_limit, Q_margin_limit)"
    margin_limit: "Q_margin_limit = available_margin * leverage / (E1 + E2)"   # B28
    required_margin: "Q*E1/leverage + Q*E2/leverage"
    margin_formula_scope: SHADOW_PROVISIONAL_LINEAR_USDT
    live_requires_runtime_validated_margin_model: true
    round_down_to_step: true
    recheck_after_rounding: [min_qty, min_notional, cost_adjusted_risk, liquidation_safety]
    diagnostic_when_margin_binds: MARGIN_CAPPED_QTY
    reject_only_if_below_exchange_minimums_or_unsafe: true
    resize_after_e1_fill: false
  liquidation:                    # B18
    shadow_unverified: RECORD_LIQ_UNVERIFIED_AND_CONTINUE
    live_requires_verified_exchange_liquidation: true

protection:                       # B21
  mandatory_after_any_execution: true
  retry_limit_source: RUNTIME_CONFIG_TESTED_BEFORE_LIVE
  on_unverifiable_protection:
    - BLOCK_E2_AND_ALL_NEW_ORDERS
    - EMERGENCY_CLOSE_VIA_VERIFIED_POSITION_CLOSE
    - RECONCILE_UNTIL_FLAT
    - ERROR_HOLD_AND_ALERT
  sl_tp_working_type: CONTRACT_PRICE   # B24, runtime-validated before Live

exchange_filters:                 # B26
  live_source: RUNTIME_PROBE_ACCEPTED_INCREMENTS_AND_MINIMUMS
  shadow_provisional_tick: "10^-pricePrecision"
  shadow_provisional_step: "10^-quantityPrecision"
  unknown_min_qty_or_min_notional: LIVE_DISABLED

shadow:
  restart:                        # B39
    restore: LAST_PERSISTED_ENGINE_AND_SETUP_STATE
    replay: STORED_MARKET_EVENTS_AFTER_CURSOR_IN_EXACT_CAUSAL_ORDER
    complete_coverage_result: IDENTICAL_TO_UNINTERRUPTED_RUN
    automatic_close_on_restart: false
  data_gap_while_active:          # B39 (any DATA_GAP / UNANCHORED / missing-minute hole)
    applies_when: [E1_ACTIVE, E2_ACTIVE, ORDER_ACTIVE, POSITION_OPEN]
    finalize_as: AMBIGUOUS_DATA_GAP
    fabricate_close_or_pnl: false
    confirmed_performance_statistics: EXCLUDED
    then: NORMAL_WARMUP_AND_SCANNING
    unarmed_setup: NORMAL_RUN_END_RULES   # B29/B30/B31
  error_hold_scope: RUNTIME_OR_SYSTEM_UNCERTAINTY_NEEDING_INTERVENTION
