[project]
name = "sp2l"
version = "5.0.0.dev0"
description = "SP2L V5 deterministic trading engine (spec in spec/)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "websockets>=13",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "numpy>=1.26",
    "TA-Lib>=0.6",
    "httpx>=0.28.1",
    "playwright>=1.63.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sp2l"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: requires local Postgres (SP2L_TEST_DATABASE_URL)",
    "browser: real-Chrome layout/screenshot tests (Playwright)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true
files = ["src/sp2l/core", "src/sp2l/smc", "src/sp2l/marketdata", "src/sp2l/runtime", "src/sp2l/persistence/market_store.py", "src/sp2l/__main__.py", "src/sp2l/api", "src/sp2l/validation", "src/sp2l/secrets.py", "src/sp2l/config.py"]

[tool.ruff.lint.per-file-ignores]
# Long SQL DDL / query literals are clearer unwrapped.
"src/sp2l/persistence/migrations/versions/*.py" = ["E501"]
"tests/db/*.py" = ["E501"]
"tests/ui/fixtures.py" = ["E501"]
# Gate-table labels and SQL are clearer unwrapped.
"src/sp2l/api/queries.py" = ["E501"]
"src/sp2l/api/presentation.py" = ["E501"]
